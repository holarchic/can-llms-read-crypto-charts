[project]
name = "llm-trader"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "python-dotenv>=1.0.0",
    "ccxt>=4.5.0",
    "mplfinance>=0.12.10b0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "requests>=2.28.0",
    "google-cloud-secret-manager>=2.20.0",
]

[tool.setuptools.packages.find]
include = ["scanner*"]

[project.optional-dependencies]
dev = ["ruff", "pytest", "pytest-xdist"]

[tool.ruff]
target-version = "py312"
line-length = 150
exclude = ["tmp/"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
"scanner/analysis.py" = ["E402"]

[tool.pytest.ini_options]
# Parallel by default — process-per-core (pytest-xdist). Requires the `dev`
# extra to be installed; run `pytest -n0` to force serial.
addopts = "-n auto"
testpaths = [
    "scanner/tests",
    "scanner/strategy/tests",
    "scanner/execution/tests",
]
