[project]
name = "trading-crypto"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "python-dotenv>=1.0.0",
    "ccxt>=4.5.0",
    "mplfinance>=0.12.10b0",
    "pandas>=2.0.0",
    "pandas-ta>=0.3.14b",
    "scipy>=1.10.0",
    "requests>=2.28.0",
    "google-cloud-secret-manager>=2.20.0",
]

[tool.setuptools.packages.find]
include = ["chart_analyzer*", "scanner*"]

[project.optional-dependencies]
dev = ["ruff", "pytest"]

[tool.ruff]
target-version = "py312"
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
"scanner/analysis.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = [
    "chart_analyzer/tests",
    "scanner/tests",
    "scanner/backtest/tests",
    "scanner/strategy/tests",
    "scanner/execution/tests",
]
